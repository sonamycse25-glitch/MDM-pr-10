<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Expense Tracker</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-blue-600 text-white text-center p-6">
        <h1 class="text-3xl font-bold">Student Expense Tracker</h1>
        <p class="mt-2">Manage your daily expenses easily</p>
    </header>


    <div class="max-w-2xl mx-auto p-5">

        <!-- Add Expense -->
        <div class="bg-white p-5 rounded-lg shadow">

            <h2 class="text-xl font-bold mb-4">
                Add Expense
            </h2>

            <input
                type="text"
                id="expenseName"
                placeholder="Expense name"
                class="w-full border p-3 rounded mb-3"
            >

            <input
                type="number"
                id="expenseAmount"
                placeholder="Amount"
                class="w-full border p-3 rounded mb-3"
            >

            <button
                onclick="addExpense()"
                class="w-full bg-blue-600 text-white p-3 rounded hover:bg-blue-700">
                Add Expense
            </button>

        </div>


        <!-- Total -->
        <div class="bg-white p-5 rounded-lg shadow mt-5 text-center">

            <h2 class="text-gray-600">
                Total Expense
            </h2>

            <p id="total"
               class="text-3xl font-bold text-green-600">
                ₹0
            </p>

        </div>


        <!-- Expense List -->
        <div class="bg-white p-5 rounded-lg shadow mt-5">

            <h2 class="text-xl font-bold mb-4">
                My Expenses
            </h2>

            <ul id="expenseList" class="space-y-3">
            </ul>

        </div>

    </div>


    <script>

        let expenses = [];


        function addExpense() {

            let name =
                document.getElementById("expenseName").value;

            let amount =
                document.getElementById("expenseAmount").value;


            if (name == "" || amount == "") {

                alert("Please enter all details");

                return;
            }


            expenses.push({
                name: name,
                amount: Number(amount)
            });


            document.getElementById("expenseName").value = "";

            document.getElementById("expenseAmount").value = "";


            displayExpenses();
        }


        function displayExpenses() {

            let list =
                document.getElementById("expenseList");

            list.innerHTML = "";


            let total = 0;


            expenses.forEach(function(expense, index) {

                total = total + expense.amount;


                let li = document.createElement("li");


                li.className =
                    "flex justify-between items-center bg-gray-100 p-3 rounded";


                li.innerHTML = `
                    <div>
                        <p class="font-bold">${expense.name}</p>
                        <p class="text-green-600">
                            ₹${expense.amount}
                        </p>
                    </div>

                    <button
                        onclick="deleteExpense(${index})"
                        class="bg-red-500 text-white px-3 py-2 rounded">
                        Delete
                    </button>
                `;


                list.appendChild(li);

            });


            document.getElementById("total").innerText =
                "₹" + total;
        }


        function deleteExpense(index) {

            expenses.splice(index, 1);

            displayExpenses();
        }

    </script>

</body>
</html>
